# Releases the packages to npm: release-please opens one release PR per package from the
# conventional commits that touched it; merging the PR tags `<package>@vX.Y.Z` and publishes.
# Publishing uses npm trusted publishing (OIDC), so the npm packages must list this repository
# and this workflow file as a trusted publisher; no NPM_TOKEN secret is needed.
#
# Run by hand (workflow_dispatch) with a package path, it publishes that one package at the version
# on main: the way out when a release was tagged and the package's publish job failed. A version
# already on npm is left alone.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package path to publish at its version on main, after a failed publish job (for example packages/vs-agent-plugin)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      paths_released: ${{ steps.release-please.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  release-package:
    name: Publish ${{ matrix.package }}
    permissions:
      id-token: write # npm trusted publishing
      contents: read
    # after a release, or by hand for one package (release-please is skipped then, hence always())
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: ubuntu-latest
    needs: [release-please]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.package) || needs.release-please.outputs.paths_released) }}
    env:
      # read from the environment in the steps below, never pasted into a script
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js v24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm
        # OIDC publishing needs a recent npm
        run: npm install -g npm@latest

      - name: Check the package and whether its version is new
        id: version
        run: |
          case "$PACKAGE" in
            packages/*) ;;
            *) echo "::error::not a package path: $PACKAGE"; exit 1 ;;
          esac
          test -f "$PACKAGE/package.json" || { echo "::error::no package at $PACKAGE"; exit 1; }
          NAME=$(jq -r .name "$PACKAGE/package.json")
          VERSION=$(jq -r .version "$PACKAGE/package.json")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        if: steps.version.outputs.publish == 'true'
        # the package and, first, its workspace dependencies (the plugin needs the eight modules' builds). A
        # directory needs the braces to take the "...": without them only the package itself was built, and the
        # plugin failed to compile on every release
        run: pnpm --filter "{./$PACKAGE}..." run build

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: pnpm publish "./$PACKAGE" --access public --provenance --no-git-checks
