# Releases the packages to npm: release-please opens one release PR per package from the
# conventional commits that touched it; merging the PR tags `<package>@vX.Y.Z` and publishes.
# Publishing uses npm trusted publishing (OIDC), so the npm packages must list this repository
# and this workflow file as a trusted publisher; no NPM_TOKEN secret is needed.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      paths_released: ${{ steps.release-please.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  release-package:
    name: Publish ${{ matrix.package }}
    permissions:
      id-token: write # npm trusted publishing
      contents: read
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    needs: [release-please]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js v24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm
        # OIDC publishing needs a recent npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # "..." builds the package's workspace dependencies first (the plugin needs the eight modules' builds)
        run: pnpm --filter "./${{ matrix.package }}..." run build

      - name: Publish to npm
        run: pnpm publish ./${{ matrix.package }} --access public --provenance --no-git-checks
